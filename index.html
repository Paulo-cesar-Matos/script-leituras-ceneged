<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Erros - TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
      <!-- CABEÇALHO -->
      <header
        class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700"
      >
        <div>
          <h1 class="text-3xl font-bold tracking-tight">
            Painel de Erros de Digitação
          </h1>
          <!-- Aqui a data e hora vão aparecer automaticamente -->
          <p class="text-slate-400 text-sm" id="texto-atualizacao">
            Aguardando atualização...
          </p>
        </div>
        <div
          id="status-atualizacao"
          class="bg-emerald-600/20 text-emerald-400 px-4 py-2 rounded-lg text-sm font-medium border border-emerald-500/30"
        >
          🟢 Sistema Operacional
        <div class="flex items-center gap-4">
          <button
            onclick="baixarExcel()"
            class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
            Baixar Excel
          </button>
          <div
            id="status-atualizacao"
            class="bg-emerald-600/20 text-emerald-400 px-4 py-2 rounded-lg text-sm font-medium border border-emerald-500/30"
          >
            🟢 Sistema Operacional
          </div>
        </div>
      </header>

      <!-- TABELA -->
      <div
        class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-slate-700/50 text-slate-300 uppercase text-xs tracking-wider select-none"
              >
                <th
                  class="p-4 cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Data"
                  onclick="definirOrdenacao('Data')"
                >
                  Data
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Instalação"
                  onclick="definirOrdenacao('Instalação')"
                >
                  Instalação
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Endereço"
                  onclick="definirOrdenacao('Endereço')"
                >
                  Endereço
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Leiturista"
                  onclick="definirOrdenacao('Leiturista')"
                >
                  Leiturista
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Supervisor"
                  onclick="definirOrdenacao('Supervisor')"
                >
                  Supervisor
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 text-center cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Consumo Atual"
                  onclick="definirOrdenacao('Consumo Atual')"
                >
                  Consumo Atual
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
                <th
                  class="p-4 text-center cursor-pointer hover:bg-slate-600/50 transition-colors group"
                  data-coluna="Média Consumo"
                  onclick="definirOrdenacao('Média Consumo')"
                >
                  Média
                  <span
                    class="sort-icon text-slate-500 group-hover:text-slate-400"
                    >&uarr;&darr;</span
                  >
                </th>
              </tr>
            </thead>
            <tbody id="corpo-tabela" class="divide-y divide-slate-700 text-sm">
              <tr>
                <td colspan="7" class="p-6 text-center text-slate-400">
                  Carregando dados...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SCRIPT DA PÁGINA -->
    <script>
      let dadosGlobais = [];
      let colunaOrdenacao = "Data";
      let ordemCrescente = false;

      function formatarData(valor) {
        if (!valor) return "";
        try {
          const d = new Date(valor);
          if (isNaN(d.getTime())) return valor;
          const dia = String(d.getDate()).padStart(2, "0");
          const mes = String(d.getMonth() + 1).padStart(2, "0");
          const ano = d.getFullYear();
          const hora = String(d.getHours()).padStart(2, "0");
          const min = String(d.getMinutes()).padStart(2, "0");
          // Se o horário for 00:00, mostra só a data
          if (hora === "00" && min === "00") return `${dia}/${mes}/${ano}`;
          return `${dia}/${mes}/${ano} ${hora}:${min}`;
        } catch (e) {
          return valor;
        }
      }

      function baixarExcel() {
        if (dadosGlobais.length === 0) {
          alert("Não há dados para baixar!");
          return;
        }

        // Criar uma cópia dos dados e formatar as datas para o Excel ficar bonito
        const dadosFormatados = dadosGlobais.map((linha) => {
          return {
            Data: formatarData(linha["Data"]),
            Instalação: linha["Instalação"],
            Endereço: linha["Endereço"],
            Leiturista: linha["Leiturista"],
            Supervisor: linha["Supervisor"],
            "Consumo Atual": linha["Consumo Atual"],
            "Média Consumo": linha["Média Consumo"],
            Leitura: linha["Leitura"],
            Medidor: linha["Medidor"],
            "Matrícula (BR)": linha["Matrícula (BR)"],
            "Consumo Simulado": linha["Consumo Simulado"],
            "Dígito Testado": linha["Dígito Testado"],
          };
        });

        // Criar a planilha
        const worksheet = XLSX.utils.json_to_sheet(dadosFormatados);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Erros");

        // Gerar o arquivo e baixar
        XLSX.writeFile(workbook, "Erros_de_Digitacao.xlsx");
      }

      function definirOrdenacao(coluna) {
        if (colunaOrdenacao === coluna) {
          ordemCrescente = !ordemCrescente;
        } else {
          colunaOrdenacao = coluna;
          ordemCrescente = true;
        }
        renderizarTabela();
        atualizarCabecalhos();
      }

      function atualizarCabecalhos() {
        const headers = document.querySelectorAll("th[data-coluna]");
        headers.forEach((th) => {
          const coluna = th.getAttribute("data-coluna");
          const span = th.querySelector(".sort-icon");
          if (coluna === colunaOrdenacao) {
            span.innerHTML = ordemCrescente ? "&uarr;" : "&darr;";
            span.className = "sort-icon ml-1 text-emerald-400";
          } else {
            span.innerHTML = "&uarr;&darr;";
            span.className =
              "sort-icon ml-1 text-slate-500 group-hover:text-slate-400";
          }
        });
      }

      function renderizarTabela() {
        const corpoTabela = document.getElementById("corpo-tabela");
        corpoTabela.innerHTML = "";

        if (dadosGlobais.length === 0) {
          corpoTabela.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-emerald-400 font-medium">Nenhum erro registrado hoje. 🎉</td></tr>`;
          return;
        }

        let dadosOrdenados = [...dadosGlobais];

        if (colunaOrdenacao) {
          dadosOrdenados.sort((a, b) => {
            let valorA = a[colunaOrdenacao] || "";
            let valorB = b[colunaOrdenacao] || "";

            // Detecta datas ISO (ex: "2026-09-03T00:00:00.000")
            let strA = valorA.toString();
            let strB = valorB.toString();
            if (strA.includes("T") && strB.includes("T")) {
                let dateA = new Date(strA);
                let dateB = new Date(strB);
                if (!isNaN(dateA.getTime()) && !isNaN(dateB.getTime())) {
                    valorA = dateA.getTime();
                    valorB = dateB.getTime();
                    if (valorA < valorB) return ordemCrescente ? -1 : 1;
                    if (valorA > valorB) return ordemCrescente ? 1 : -1;
                    return 0;
                }
            }

            // Tratar conversão para números quando possível
            let numStrA = strA.replace(",", ".");
            let numStrB = strB.replace(",", ".");
            let numA = parseFloat(numStrA);
            let numB = parseFloat(numStrB);

            // Se ambos forem números (e.g. consumo)
            if (
              !isNaN(numA) &&
              !isNaN(numB) &&
              numStrA.trim() !== "" &&
              numStrB.trim() !== ""
            ) {
              valorA = numA;
              valorB = numB;
            } else {
              valorA = valorA.toString().toLowerCase();
              valorB = valorB.toString().toLowerCase();
            }

            if (valorA < valorB) return ordemCrescente ? -1 : 1;
            if (valorA > valorB) return ordemCrescente ? 1 : -1;
            return 0;
          });
        }

        dadosOrdenados.forEach((linha) => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-700/30 transition-colors";

          tr.innerHTML = `
                <td class="p-4 text-slate-400">${formatarData(linha["Data"])}</td>
                <td class="p-4 font-semibold text-amber-400">${linha["Instalação"] || ""}</td>
                <td class="p-4 text-slate-300">${linha["Endereço"] || ""}</td>
                <td class="p-4 text-slate-300">${linha["Leiturista"] || ""}</td>
                <td class="p-4 text-slate-400 text-xs">${linha["Supervisor"] || ""}</td>
                <td class="p-4 text-center font-bold text-rose-400">${linha["Consumo Atual"] || ""}</td>
                <td class="p-4 text-center text-slate-400">${linha["Média Consumo"] || ""}</td>
            `;
          corpoTabela.appendChild(tr);
        });
      }

      async function carregarDados() {
        try {
          const resposta = await fetch(
            "dados_tv.json?t=" + new Date().getTime(),
          );

          if (!resposta.ok) throw new Error("Arquivo não encontrado");

          dadosGlobais = await resposta.json();

          // Atualiza o texto do cabeçalho com a Data e Hora
          const agora = new Date();
          const dataFormatada = agora.toLocaleDateString("pt-BR");
          const horaFormatada = agora.toLocaleTimeString("pt-BR");
          document.getElementById("texto-atualizacao").innerText =
            `Última atualização: ${dataFormatada} às ${horaFormatada}`;

          renderizarTabela();
          atualizarCabecalhos();

          document.getElementById("status-atualizacao").className =
            "bg-emerald-600/20 text-emerald-400 px-4 py-2 rounded-lg text-sm font-medium border border-emerald-500/30";
          document.getElementById("status-atualizacao").innerText =
            "🟢 Atualizado";
        } catch (erro) {
          console.error("Erro:", erro);
          document.getElementById("status-atualizacao").className =
            "bg-rose-600/20 text-rose-400 px-4 py-2 rounded-lg text-sm font-medium border border-rose-500/30";
          document.getElementById("status-atualizacao").innerText =
            "🔴 Aguardando dados...";
        }
      }

      carregarDados();
      setInterval(carregarDados, 15000); // Atualiza a página a cada 15 segundos
    </script>
  </body>
</html>
